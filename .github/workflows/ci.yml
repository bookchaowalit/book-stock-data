name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FREE_ONLY: "true"
      ALLOW_PAID_PROVIDERS: "false"
      ALLOW_EXTERNAL_WRITES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with the pinned shared lake runtime
        run: python -m pip install -e ".[lake]" pytest ruff
      - name: Check shared lake runtime is importable
        run: python -c "import data_lake.product_adapter, data_lake.silver"
      - name: Lint
        run: ruff check .
      # The [lake] extra installs solo-empire-data-lake, so Bronze/Silver lake
      # tests run here instead of skipping; -rs keeps any remaining skips visible.
      - name: Tests (standalone, including lake integration)
        run: python -m pytest -q -rs
      - run: python -m compileall -q src
      - run: python -m book_stock.ingest --help
      - run: book-stock-data --help
